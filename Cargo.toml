[package]
name = "herdr-browser"
version = "0.1.0"
edition = "2024"
description = "Dedicated live browser for Herdr Desktop and hc."
license = "MIT"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
miniz_oxide = "0.9.1"
png = "0.18"
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # keep users' config files in their order
toml = "1.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zune-jpeg = "0.5.15"

[profile.release]
strip = true
